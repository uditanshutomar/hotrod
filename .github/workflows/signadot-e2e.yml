name: Signadot E2E

# `pull_request` (NOT pull_request_target): a fork PR runs without access to
# repository secrets. Never switch this to pull_request_target -- it would hand
# secrets to code from an untrusted fork.
# No branch filter: a stacked fix PR (e.g. from @coderabbitai fix-ci) targets the
# feature branch, not main. Without this it would never be validated against the
# environment that caught the bug in the first place.
on:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  e2e:
    name: Playwright against a Signadot sandbox
    runs-on: ubuntu-latest
    env:
      SIGNADOT_ORG: ${{ secrets.SIGNADOT_ORG }}
      SIGNADOT_API_KEY: ${{ secrets.SIGNADOT_API_KEY }}
      NAMESPACE: hotrod-istio
      CLUSTER: minikube
      # Must match your cluster node's architecture.
      NODE_ARCH: arm64
    steps:
      - uses: actions/checkout@v4

      # github.head_ref is attacker-controlled: anyone can open a PR from a
      # branch whose name contains shell metacharacters. Every github.* value
      # reaches the shell through env, never through ${{ }} interpolation
      # inside a run: block, and the branch name is validated before use.
      - name: Derive names
        id: vars
        env:
          BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$BRANCH" in
            *[!A-Za-z0-9._/-]*|"")
              echo "::error::Refusing to run: branch name contains unexpected characters."
              exit 1 ;;
          esac
          echo "branch=$BRANCH"                                >> "$GITHUB_OUTPUT"
          echo "sandbox=pr-${PR_NUMBER}-driver"                >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO}/hotrod:${HEAD_SHA}"      >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # The Dockerfile only COPYs a prebuilt binary, so cross-building for the
      # cluster's architecture needs no emulation.
      - name: Build the binary for the cluster's architecture
        run: |
          mkdir -p "dist/linux/$NODE_ARCH/bin"
          CGO_ENABLED=0 GOOS=linux GOARCH="$NODE_ARCH" \
            go build -trimpath -o "dist/linux/$NODE_ARCH/bin/hotrod" ./cmd/hotrod

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the PR image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ env.NODE_ARCH }}
          provenance: false
          push: true
          tags: ${{ steps.vars.outputs.image }}

      - name: Install the Signadot CLI
        run: curl -sSLf https://raw.githubusercontent.com/signadot/cli/main/scripts/install.sh | sh

      - name: Create the sandbox from the committed template
        env:
          SANDBOX: ${{ steps.vars.outputs.sandbox }}
          IMAGE: ${{ steps.vars.outputs.image }}
          BRANCH: ${{ steps.vars.outputs.branch }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          signadot sandbox apply -f .signadot/sbx-pr.yaml \
            --set name="$SANDBOX" \
            --set cluster="$CLUSTER" \
            --set service=driver \
            --set namespace="$NAMESPACE" \
            --set branch="$BRANCH" \
            --set github-pr="$PR_NUMBER" \
            --set repo="$REPO" \
            --set image="$IMAGE"

      # --attach streams the job's output here and exits non-zero when the job
      # fails, which is what turns this check red. The suite runs with
      # Playwright's `github` reporter, so each failure is emitted as a
      # ::error file=,line=:: command that GitHub turns into an annotation on
      # the real source line.
      - name: Run the existing Playwright suite as a Signadot Job
        id: e2e
        env:
          SANDBOX: ${{ steps.vars.outputs.sandbox }}
          BRANCH: ${{ steps.vars.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          signadot job submit -f .signadot/testing/pr-playwright-job.yaml \
            --set sandbox="$SANDBOX" \
            --set branch="$BRANCH" \
            --set repo="$REPO" \
            --set namespace="$NAMESPACE" \
            --attach --timeout 20m 2>&1 | tee job.log

      - name: Publish the failure to the job summary
        if: failure() && steps.e2e.outcome == 'failure'
        env:
          SANDBOX: ${{ steps.vars.outputs.sandbox }}
        run: |
          {
            echo "## Playwright failed against Signadot sandbox \`$SANDBOX\`"
            echo
            echo '```'
            tail -c 60000 job.log | grep -aE "✘|✓|Error:|Timed out|expect\(|FAILED|Sandbox:" | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
