spec:
  namePrefix: hotrod-playwright-e2e
  runnerGroup: playwright
  script: |
    #!/bin/bash
    set -e

    git clone --single-branch -b "@{branch}" "https://github.com/@{repo}.git" hotrod
    cd hotrod

    export HOTROD_NAMESPACE="@{namespace}"
    export CI=true
    export CYPRESS_INSTALL_BINARY=0      # skip the 300MB Cypress download

    npm ci

    set +e
    npx playwright test --reporter=github,list
    E2E_EXIT_CODE=$?
    set -e

    tar czf playwright-report.tar.gz playwright-report || true

    # Failure summary LAST: CodeRabbit reads the tail of oversized logs.
    echo ""
    echo "======================================================"
    if [ "$E2E_EXIT_CODE" -ne 0 ]; then
      echo "PLAYWRIGHT FAILED (exit $E2E_EXIT_CODE)"
      echo "Sandbox: @{sandbox}   Namespace: @{namespace}"
      grep -aE "✘|Error:|expect\(|Timed out" test-results/*/*.txt 2>/dev/null | head -20
      grep -aE "✘|Error:|Timed out|expect\(" playwright-report/index.html 2>/dev/null | head -5
    else
      echo "PLAYWRIGHT PASSED"
    fi
    echo "======================================================"

    exit $E2E_EXIT_CODE
  routingContext:
    sandbox: "@{sandbox}"
  uploadArtifact:
    - path: hotrod/playwright-report.tar.gz
