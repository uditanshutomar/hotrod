name: "@{name}"
spec:
  description: preview environment for PR @{github-pr}
  cluster: "@{cluster}"
  labels:
    # These two link the sandbox to the PR: Signadot comments sandbox status on
    # the pull request and deletes the sandbox when it closes. They require the
    # Signadot GitHub App installed on the repo.
    signadot/github-repo: "@{repo}"
    signadot/github-pull-request: "@{github-pr}"
    branch: "@{branch}"
  ttl:
    duration: 1d
  forks:
  - forkOf:
      kind: Deployment
      name: "@{service}"
      namespace: "@{namespace}"
    customizations:
      images:
      - container: hotrod
        image: "@{image}"
      # The HotROD overlay pins imagePullPolicy: Never so a local cluster can
      # use a preloaded image. A fork inherits that, which makes a CI-built
      # image unpullable. Override it for this fork only.
      patch:
        type: strategic
        value: |
          spec:
            template:
              spec:
                containers:
                - name: hotrod
                  imagePullPolicy: IfNotPresent
